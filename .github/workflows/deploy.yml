name: Deploy from GHCR

on:
  push:
    tags: ['v*']

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  COMPOSE_SERVICE: app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Prepare image name
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf 'IMAGE_NAME=%s\n' "$image" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          {
            printf 'Host deploy-target\n'
            printf '  HostName %s\n' "$SERVER_HOST"
            printf '  User %s\n' "$SERVER_USER"
            printf '  IdentityFile ~/.ssh/deploy_key\n'
            printf '  IdentitiesOnly yes\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  UserKnownHostsFile ~/.ssh/known_hosts\n'
            printf '  BatchMode yes\n'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Upload deployment files
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh deploy-target \
            "mkdir -p $(printf '%q' "$DEPLOY_PATH")"

          scp -r \
            docker-compose.yml scripts/deploy-ghcr.sh \
            "deploy-target:$DEPLOY_PATH/"

      - name: Pull and restart
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          APP_IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          printf '%s\n' "$GHCR_TOKEN" | ssh deploy-target \
            "DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") \
             COMPOSE_SERVICE=$(printf '%q' "$COMPOSE_SERVICE") \
             APP_IMAGE_REF=$(printf '%q' "$APP_IMAGE_REF") \
             GHCR_USERNAME=$(printf '%q' "$GHCR_USERNAME") \
             bash $(printf '%q' "$DEPLOY_PATH/deploy-ghcr.sh")"
