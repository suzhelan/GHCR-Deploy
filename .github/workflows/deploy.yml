name: Deploy from GHCR

on:
  push:
    tags: ['v*']

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  COMPOSE_SERVICE: app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Validate deployment settings
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SERVER_FINGERPRINT: ${{ secrets.SERVER_FINGERPRINT }}
        run: |
          set -euo pipefail
          : "${SERVER_FINGERPRINT:?SERVER_FINGERPRINT is required for host verification}"
          [[ "$DEPLOY_PATH" = /* && "$DEPLOY_PATH" != / ]]

      - name: Prepare image name
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf 'IMAGE_NAME=%s\n' "$image" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            mkdir -p -- "$DEPLOY_PATH"

      - name: Upload deployment files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          source: docker-compose.yml,scripts/deploy-ghcr.sh
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          APP_IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          envs: DEPLOY_PATH,COMPOSE_SERVICE,APP_IMAGE_REF,GHCR_USERNAME,GHCR_TOKEN
          command_timeout: 20m
          script: |
            set -euo pipefail
            printf '%s\n' "$GHCR_TOKEN" | \
              bash "$DEPLOY_PATH/scripts/deploy-ghcr.sh"
